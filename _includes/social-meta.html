<!-- Open Graph / Social Preview Meta -->
<meta property="og:site_name" content="Sowell Solutions" />
<meta property="og:type" content="website" />
<meta property="og:title" content="{{ page.og_title | default: page.title | default: 'Sowell Solutions | Business Consulting in Chino, CA' }}" />
